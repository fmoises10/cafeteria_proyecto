<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Inventario</title>
</head>

<body>

    <h1>Gestión de Inventario</h1>

    <h2>Registrar insumo</h2>

    <form id="formularioInsumo">

        <label>Nombre:</label>
        <input type="text" id="nombre" required>

        <br><br>

        <label>Unidad:</label>

        <select id="unidad" required>
            <option value="GRAMOS">Gramos</option>
            <option value="ML">Mililitros</option>
            <option value="UNIDADES">Unidades</option>
        </select>

        <br><br>

        <label>Stock:</label>
        <input type="number" id="stock" min="0" required>

        <br><br>

        <button type="submit">Registrar insumo</button>

    </form>

    <hr>

    <h2>Insumos registrados</h2>

    <button onclick="cargarInsumos()">Actualizar lista</button>

    <br><br>

    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Unidad</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="tablaInsumos">
        </tbody>

    </table>

    <br>

    <a href="/panel-admin.html">Volver al panel</a>


    <script>

        // REGISTRAR INSUMO

        document.getElementById("formularioInsumo").addEventListener("submit", async function (event) {

            event.preventDefault();

            const nombre = document.getElementById("nombre").value;
            const unidad = document.getElementById("unidad").value;
            const stock = document.getElementById("stock").value;

            try {

                const respuesta = await fetch("/insumos", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        nombre: nombre,
                        unidad: unidad,
                        stock: Number(stock)
                    })

                });

                if (respuesta.ok) {

                    alert("Insumo registrado correctamente.");

                    document.getElementById("formularioInsumo").reset();

                    cargarInsumos();

                } else {

                    alert("Error al registrar el insumo.");

                }

            } catch (error) {

                console.error(error);

                alert("Error al conectar con el servidor.");

            }

        });


        // LISTAR INSUMOS

        async function cargarInsumos() {

            try {

                const respuesta = await fetch("/insumos");

                if (!respuesta.ok) {
                    throw new Error("Error al obtener los insumos");
                }

                const insumos = await respuesta.json();

                const tabla = document.getElementById("tablaInsumos");

                tabla.innerHTML = "";

                insumos.forEach(insumo => {

                    const fila = document.createElement("tr");

                    fila.innerHTML = `

                        <td>${insumo.id}</td>

                        <td>${insumo.nombre}</td>

                        <td>${insumo.unidad}</td>

                        <td>${insumo.stock}</td>

                        <td>
                            <button onclick="editarInsumo(${insumo.id})">
                                Editar
                            </button>
                        </td>

                    `;

                    tabla.appendChild(fila);

                });

            } catch (error) {

                console.error(error);

                alert("No se pudieron cargar los insumos.");

            }

        }


        // EDITAR INSUMO

        async function editarInsumo(id) {

            const nombre = prompt("Ingrese el nuevo nombre:");

            if (!nombre) {
                return;
            }

            const unidad = prompt(
                "Ingrese la unidad:\n\nGRAMOS\nML\nUNIDADES"
            );

            if (!unidad) {
                return;
            }

            const stock = prompt("Ingrese el nuevo stock:");

            if (stock === null || stock === "") {
                return;
            }

            try {

                const respuesta = await fetch(`/insumos/${id}`, {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        nombre: nombre,
                        unidad: unidad,
                        stock: Number(stock)
                    })

                });

                if (respuesta.ok) {

                    alert("Insumo actualizado correctamente.");

                    cargarInsumos();

                } else {

                    alert("Error al actualizar el insumo.");

                }

            } catch (error) {

                console.error(error);

                alert("Error al conectar con el servidor.");

            }

        }


        // CARGAR AL ABRIR LA PÁGINA

        cargarInsumos();

    </script>

</body>

</html>
