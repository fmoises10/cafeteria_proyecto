<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contenedores</title>
</head>

<body>

    <h1>Gestión de Contenedores</h1>

    <h2>Registrar contenedor</h2>

    <form id="formularioContenedor">

        <label>Insumo:</label>

        <select id="insumoId" required>
            <option value="">Seleccione un insumo</option>
        </select>

        <br><br>

        <label>Código de barras:</label>
        <input type="text" id="codigoBarras" required>

        <br><br>

        <label>Capacidad máxima:</label>
        <input type="number" id="capacidadMaxima" min="0" required>

        <br><br>

        <label>Saldo actual:</label>
        <input type="number" id="saldo" min="0" required>

        <br><br>

        <label>Dosis por escaneo:</label>
        <input type="number" id="dosis" min="0" required>

        <br><br>

        <button type="submit">
            Registrar contenedor
        </button>

    </form>

    <hr>

    <h2>Simular escaneo</h2>

    <p>
        Como todavía no tienes lector, escribe manualmente
        el código de barras.
    </p>

    <input type="text" id="codigoEscaneo" placeholder="Código de barras">

    <button onclick="consumir()">
        Escanear y consumir
    </button>

    <p id="mensajeConsumo"></p>

    <hr>

    <h2>Contenedores registrados</h2>

    <button onclick="cargarContenedores()">
        Actualizar lista
    </button>

    <br><br>

    <table border="1">

        <thead>

            <tr>
                <th>ID</th>
                <th>Insumo</th>
                <th>Código de barras</th>
                <th>Capacidad máxima</th>
                <th>Saldo</th>
                <th>Dosis</th>
            </tr>

        </thead>

        <tbody id="tablaContenedores">
        </tbody>

    </table>

    <br>

    <a href="/panel-admin.html">
        Volver al panel
    </a>


    <script>

        // CARGAR INSUMOS

        async function cargarInsumos() {

            const respuesta =
                await fetch("/insumos");

            const insumos =
                await respuesta.json();

            const select =
                document.getElementById("insumoId");

            select.innerHTML =
                '<option value="">Seleccione un insumo</option>';

            insumos.forEach(insumo => {

                const opcion =
                    document.createElement("option");

                opcion.value = insumo.id;

                opcion.textContent =
                    insumo.nombre +
                    " (" +
                    insumo.unidad +
                    ")";

                select.appendChild(opcion);

            });

        }


        // REGISTRAR CONTENEDOR

        document.getElementById("formularioContenedor")
            .addEventListener("submit", async function (event) {

                event.preventDefault();

                const insumoId =
                    document.getElementById("insumoId").value;

                const codigoBarras =
                    document.getElementById("codigoBarras").value;

                const capacidadMaxima =
                    document.getElementById("capacidadMaxima").value;

                const saldo =
                    document.getElementById("saldo").value;

                const dosis =
                    document.getElementById("dosis").value;


                const respuesta =
                    await fetch("/contenedores", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            insumoId: Number(insumoId),

                            codigoBarras: codigoBarras,

                            capacidadMaxima:
                                Number(capacidadMaxima),

                            saldo: Number(saldo),

                            dosis: Number(dosis)

                        })

                    });


                if (respuesta.ok) {

                    alert(
                        "Contenedor registrado correctamente."
                    );

                    document.getElementById(
                        "formularioContenedor"
                    ).reset();

                    cargarContenedores();

                } else {

                    alert(
                        "Error al registrar el contenedor."
                    );

                }

            });


        // CONSUMIR POR CÓDIGO DE BARRAS

        async function consumir() {

            const codigo =
                document.getElementById(
                    "codigoEscaneo"
                ).value;


            if (!codigo) {

                alert(
                    "Ingrese un código de barras."
                );

                return;

            }


            const respuesta =
                await fetch(
                    "/contenedores/consumir?codigoBarras="
                    + encodeURIComponent(codigo),
                    {
                        method: "POST"
                    }
                );


            const mensaje =
                await respuesta.text();


            document.getElementById(
                "mensajeConsumo"
            ).textContent = mensaje;


            document.getElementById(
                "codigoEscaneo"
            ).value = "";


            cargarContenedores();

        }


        // LISTAR CONTENEDORES

        async function cargarContenedores() {

            const respuesta =
                await fetch("/contenedores");

            const contenedores =
                await respuesta.json();


            const respuestaInsumos =
                await fetch("/insumos");

            const insumos =
                await respuestaInsumos.json();


            const tabla =
                document.getElementById(
                    "tablaContenedores"
                );

            tabla.innerHTML = "";


            contenedores.forEach(contenedor => {

                const insumo =
                    insumos.find(
                        i =>
                            i.id === contenedor.insumoId
                    );


                const fila =
                    document.createElement("tr");


                fila.innerHTML = `

                    <td>${contenedor.id}</td>

                    <td>
                        ${insumo
                        ? insumo.nombre
                        : "Sin insumo"
                    }
                    </td>

                    <td>
                        ${contenedor.codigoBarras}
                    </td>

                    <td>
                        ${contenedor.capacidadMaxima}
                    </td>

                    <td>
                        ${contenedor.saldo}
                    </td>

                    <td>
                        ${contenedor.dosis}
                    </td>

                `;


                tabla.appendChild(fila);

            });

        }


        // CARGAR AL ABRIR

        cargarInsumos();

        cargarContenedores();

    </script>

</body>

</html>
