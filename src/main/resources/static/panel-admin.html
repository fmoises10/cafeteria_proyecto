<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel Administrador</title>
</head>

<body>

    <h1>Panel de Administrador</h1>

    <p id="bienvenida"></p>

    <hr>

    <h2>Módulos</h2>

    <button onclick="irPersonal()">
        Personal
    </button>

    <button onclick="irInventario()">
        Inventario
    </button>

    <button onclick="irContenedores()">
        Contenedores
    </button>

    <button onclick="irProductos()">
        Productos
    </button>

    <button onclick="irVentas()">
        Ventas
    </button>

    <button onclick="irCaja()">
        Caja
    </button>

    <button onclick="irReportes()">
        Reportes
    </button>

    <br><br>

    <button onclick="cerrarSesion()">
        Cerrar sesión
    </button>

    <script>

        const usuario =
            JSON.parse(
                localStorage.getItem("usuario")
            );

        if (!usuario) {

            window.location.href =
                "/index.html";

        } else {

            document.getElementById(
                "bienvenida"
            ).textContent =
                "Bienvenido, " + usuario.nombre;
        }


        function irPersonal() {

            window.location.href =
                "/personal.html";
        }


        function irInventario() {

            window.location.href =
                "/inventario.html";
        }


        function irContenedores() {

            window.location.href =
                "/contenedores.html";
        }


        function irProductos() {

            window.location.href =
                "/productos.html";
        }


        function irVentas() {

            window.location.href =
                "/ventas.html";
        }


        function irCaja() {

            window.location.href =
                "/caja.html";
        }


        function irReportes() {

            window.location.href =
                "/reportes.html";
        }


        function cerrarSesion() {

            localStorage.removeItem("usuario");

            window.location.href =
                "/index.html";
        }

    </script>

</body>

</html>
