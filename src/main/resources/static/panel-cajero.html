<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Cajero / Barista</title>
</head>

<body>

    <h1>Panel de Cajero / Barista</h1>

    <p id="bienvenida">Verificando sesión...</p>

    <hr>

    <h2>Módulos</h2>

    <button onclick="irVentas()">Nuevo Pedido</button>
    <button onclick="irVentas()">Ventas</button>
    <button onclick="irContenedores()">Escanear Insumo</button>

    <br><br>

    <button onclick="cerrarSesion()">Cerrar sesión</button>

    <script>

        async function verificarSesion() {

            try {

                const respuesta = await fetch("/login/actual", {
                    credentials: "same-origin"
                });

                if (!respuesta.ok) {
                    window.location.href = "/index.html";
                    return;
                }

                const usuario = await respuesta.json();

                if (
                    usuario.rol !== "CAJERO" &&
                    usuario.rol !== "BARISTA"
                ) {
                    window.location.href = "/index.html";
                    return;
                }

                document.getElementById("bienvenida").textContent =
                    "Bienvenido, " + usuario.nombre;

            } catch (error) {

                console.error(error);
                window.location.href = "/index.html";

            }

        }

        function irVentas() {
            window.location.href = "/ventas.html";
        }

        function irContenedores() {
            window.location.href = "/contenedores.html";
        }

        async function cerrarSesion() {

            try {

                await fetch("/login/logout", {
                    method: "POST",
                    credentials: "same-origin"
                });

            } catch (error) {

                console.error(error);

            }

            localStorage.removeItem("usuario");
            window.location.href = "/index.html";

        }

        verificarSesion();

    </script>

</body>

</html>
